version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: loglens-redis
    restart: unless-stopped
    # Not exposing to host in production
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: loglens-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # Security disabled for local development — enable xpack.security.enabled=true for production
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    image: ${DOCKERHUB_USERNAME:-local}/loglens-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: loglens-node-backend
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000/api/v1
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SERVICE_KEY=${SERVICE_KEY}
      - BULL_BOARD_USER=${BULL_BOARD_USER:-admin}
      - BULL_BOARD_PASS=${BULL_BOARD_PASS}
      - DISABLE_EMBEDDED_WORKER=true
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  worker:
    image: ${DOCKERHUB_USERNAME:-local}/loglens-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: loglens-node-worker
    command: ["npm", "run", "start:worker"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SERVICE_KEY=${SERVICE_KEY}
      - WORKER_CONCURRENCY=10
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - AI_SERVICE_URL=http://ai-service:8000/api/v1
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  ai-service:
    image: ${DOCKERHUB_USERNAME:-local}/loglens-ai:${IMAGE_TAG:-latest}
    build:
      context: ./loglens-ai
      dockerfile: Dockerfile
    container_name: loglens-ai-service
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SERVICE_KEY=${SERVICE_KEY}
      - MODEL=llama-3.3-70b-versatile
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - ML_MODEL_DIR=/models
    volumes:
      - ai_models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/loglens-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: loglens-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
      - NEXT_PUBLIC_BULL_BOARD_URL=${NEXT_PUBLIC_BULL_BOARD_URL}
      - INTERNAL_API_URL=http://backend:4000/api/v1
    restart: unless-stopped
    depends_on:
      - backend

  # ── Optional: Distributed Tracing (Jaeger) ─────────────────────────────────
  # Start with: docker compose --profile observability up
  # Jaeger UI: http://localhost:16686
  # Backend traces are exported via OTLP HTTP to http://jaeger:4318/v1/traces
  # Set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in .env to enable export.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: loglens-jaeger
    profiles:
      - observability
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI
      - "127.0.0.1:4317:4317"     # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"     # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger_data:/badger
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
    driver: local
  es_data:
    driver: local
  ai_models:
    driver: local
  jaeger_data:
    driver: local

