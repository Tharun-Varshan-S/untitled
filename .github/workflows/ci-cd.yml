name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run lint
        working-directory: ./frontend
        run: npm run lint
      - name: Run security audit
        working-directory: ./frontend
        # Informational only until we fix upstream dependencies
        continue-on-error: true
        run: npm audit
      - name: Run tests
        working-directory: ./frontend
        run: npx vitest run --pool=forks
      - name: Build
        working-directory: ./frontend
        run: npm run build

  test-backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-dummy-jwt-secret
      GROQ_API_KEY: ci-dummy-groq-key
      SERVICE_KEY: ci-dummy-service-key
      MONGODB_URI: mongodb://localhost:27017/ci-dummy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      - name: Run security audit
        working-directory: ./backend
        run: npm audit
      - name: Run tests
        working-directory: ./backend
        run: npm test
      - name: Build
        working-directory: ./backend
        run: npm run build

  test-worker:
    name: Worker CI
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-dummy-jwt-secret
      GROQ_API_KEY: ci-dummy-groq-key
      SERVICE_KEY: ci-dummy-service-key
      MONGODB_URI: mongodb://localhost:27017/ci-dummy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      - name: Run worker tests
        working-directory: ./backend
        run: npx jest src/__tests__/ai-pipeline/worker.test.ts src/__tests__/delayedJobs.integration.test.ts src/__tests__/repeatableJobs.integration.test.ts src/__tests__/scalingWorkers.integration.test.ts --runInBand

  test-ai-service:
    name: AI Service CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        working-directory: ./loglens-ai
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: ./loglens-ai
        env:
          PYTHONPATH: .
        run: pytest

  build-docker:
    name: Build Docker Images
    needs: [test-frontend, test-backend, test-worker, test-ai-service]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push loglens-backend (and worker)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/loglens-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/loglens-worker:${{ github.sha }}
      
      - name: Build and push loglens-frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/loglens-frontend:${{ github.sha }}
          
      - name: Build and push loglens-ai
        uses: docker/build-push-action@v5
        with:
          context: ./loglens-ai
          file: ./loglens-ai/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/loglens-ai:${{ github.sha }}

  deploy:
    name: Deploy to Production
    needs: [build-docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Deployment Script via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            if [ -z "${{ vars.PROD_PROJECT_PATH }}" ]; then
              echo "Error: PROD_PROJECT_PATH variable is not set."
              exit 1
            fi
            
            cd ${{ vars.PROD_PROJECT_PATH }}
            bash ./scripts/deploy.sh ${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }} ${{ secrets.DOCKERHUB_TOKEN }}
