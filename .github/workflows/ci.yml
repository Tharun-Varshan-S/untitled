name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run lint
        working-directory: ./frontend
        run: npm run lint
      - name: Run tests
        working-directory: ./frontend
        run: npx vitest run --pool=forks
      - name: Build
        working-directory: ./frontend
        run: npm run build

  test-backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-dummy-jwt-secret
      GROQ_API_KEY: ci-dummy-groq-key
      SERVICE_KEY: ci-dummy-service-key
      MONGODB_URI: mongodb://localhost:27017/dummy_ci_db
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      - name: Run tests
        working-directory: ./backend
        run: npm test

  test-worker:
    name: Worker CI
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-dummy-jwt-secret
      GROQ_API_KEY: ci-dummy-groq-key
      SERVICE_KEY: ci-dummy-service-key
      MONGODB_URI: mongodb://localhost:27017/dummy_ci_db
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      - name: Run worker tests
        working-directory: ./backend
        run: npx jest src/__tests__/ai-pipeline/worker.test.ts src/__tests__/delayedJobs.integration.test.ts src/__tests__/repeatableJobs.integration.test.ts src/__tests__/scalingWorkers.integration.test.ts --runInBand

  test-ai-service:
    name: AI Service CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        working-directory: ./loglens-ai
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: ./loglens-ai
        env:
          PYTHONPATH: .
        run: pytest
