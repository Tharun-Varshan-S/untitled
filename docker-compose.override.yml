version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: loglens-mongo
    ports:
      - "27017:27017"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    environment:
      - MONGODB_URI=mongodb://mongo:27017/loglens
      - JWT_SECRET=dummy-jwt-secret
      - GROQ_API_KEY=dummy-groq-key
      - SERVICE_KEY=dummy-service-key
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  worker:
    environment:
      - MONGODB_URI=mongodb://mongo:27017/loglens
      - JWT_SECRET=dummy-jwt-secret
      - GROQ_API_KEY=dummy-groq-key
      - SERVICE_KEY=dummy-service-key
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  ai-service:
    environment:
      - GROQ_API_KEY=dummy-groq-key
      - SERVICE_KEY=dummy-service-key

  frontend:
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
      - NEXT_PUBLIC_SOCKET_URL=ws://localhost:4000
      - NEXT_PUBLIC_BULL_BOARD_URL=http://localhost:4000/admin/queues
