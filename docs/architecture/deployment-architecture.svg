<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" style="background-color: #0b0f19; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="queueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="0" y="0" width="1200" height="70" fill="#0f172a" />
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#6366f1" stroke-width="2" />
  <text x="30" y="38" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">LogLens – Deployment Architecture Diagram</text>
  <text x="30" y="58" fill="#94a3b8" font-size="13">Physical infrastructure, Docker container topologies, cloud databases, and network ports</text>
  <rect x="1040" y="20" width="130" height="30" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="1105" y="40" fill="#a5b4fc" font-size="12" font-weight="600" text-anchor="middle">LOGLENS ARCH</text>
<rect x="40" y="100" width="220" height="700" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" /><text x="55" y="125" fill="#38bdf8" font-size="13" font-weight="700">CLIENT ENVIRONMENT</text>
    <g filter="url(#dropShadow)">
      <rect x="60" y="150" width="180" height="120" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="60" y="150" width="180" height="34" rx="10" fill="#1e293b" />
      <rect x="60" y="180" width="180" height="4" fill="#38bdf8" />
      <text x="75" y="172" fill="#f8fafc" font-size="14" font-weight="600">External App Server</text>
      <text x="75" y="200" fill="#94a3b8" font-size="12">Runs SDK Client Package</text>
    </g>
  <text x="75" y="220" fill="#cbd5e1" font-size="11">• Node.js / Express Host</text><text x="75" y="240" fill="#cbd5e1" font-size="11">• Outbound Port 5000</text>
    <g filter="url(#dropShadow)">
      <rect x="60" y="320" width="180" height="140" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="60" y="320" width="180" height="34" rx="10" fill="#1e293b" />
      <rect x="60" y="350" width="180" height="4" fill="#38bdf8" />
      <text x="75" y="342" fill="#f8fafc" font-size="14" font-weight="600">Web Dashboard</text>
      <text x="75" y="370" fill="#94a3b8" font-size="12">Browser Client (Port 3000)</text>
    </g>
  <text x="75" y="390" fill="#cbd5e1" font-size="11">• Next.js 16 App Router</text><text x="75" y="410" fill="#cbd5e1" font-size="11">• React 19 SPA</text><text x="75" y="430" fill="#cbd5e1" font-size="11">• Socket.IO Client</text><rect x="300" y="100" width="560" height="700" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" /><text x="315" y="125" fill="#a5b4fc" font-size="13" font-weight="700">APPLICATION SERVER HOST (Docker / Node Cluster)</text><rect x="320" y="150" width="520" height="230" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" /><text x="335" y="175" fill="#f8fafc" font-size="14" font-weight="600">Container 1: LogLens Express API (Port 5000)</text>
    <g filter="url(#dropShadow)">
      <rect x="340" y="190" width="230" height="170" rx="10" fill="#111827" stroke="#6366f1" stroke-width="1.5" />
      <rect x="340" y="190" width="230" height="34" rx="10" fill="#1e293b" />
      <rect x="340" y="220" width="230" height="4" fill="#6366f1" />
      <text x="355" y="212" fill="#f8fafc" font-size="14" font-weight="600">API Gateway Process</text>
      <text x="355" y="240" fill="#94a3b8" font-size="12">index.ts / app.ts</text>
    </g>
  <text x="355" y="260" fill="#cbd5e1" font-size="11">• Express HTTP Ingestion</text><text x="355" y="280" fill="#cbd5e1" font-size="11">• JWT & API Key Auth</text><text x="355" y="300" fill="#cbd5e1" font-size="11">• Rate Limiting Guard</text><text x="355" y="320" fill="#cbd5e1" font-size="11">• Bull Board UI (/admin/queues)</text>
    <g filter="url(#dropShadow)">
      <rect x="590" y="190" width="230" height="170" rx="10" fill="#111827" stroke="#06b6d4" stroke-width="1.5" />
      <rect x="590" y="190" width="230" height="34" rx="10" fill="#1e293b" />
      <rect x="590" y="220" width="230" height="4" fill="#06b6d4" />
