      <text x="605" y="240" fill="#94a3b8" font-size="12">WebSocket Endpoint</text>
    </g>
  <text x="605" y="260" fill="#cbd5e1" font-size="11">• WebSockets (ws://...)</text><text x="605" y="280" fill="#cbd5e1" font-size="11">• Room Isolation</text><text x="605" y="300" fill="#cbd5e1" font-size="11">• CORS Origin Guard</text><rect x="320" y="410" width="520" height="230" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" /><text x="335" y="435" fill="#f8fafc" font-size="14" font-weight="600">Container 2: Standalone BullMQ Worker (worker.ts)</text>
    <g filter="url(#dropShadow)">
      <rect x="340" y="450" width="230" height="170" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5" />
      <rect x="340" y="450" width="230" height="34" rx="10" fill="#1e293b" />
      <rect x="340" y="480" width="230" height="4" fill="#10b981" />
      <text x="355" y="472" fill="#f8fafc" font-size="14" font-weight="600">Log Worker Process</text>
      <text x="355" y="500" fill="#94a3b8" font-size="12">Clustered Node Workers</text>
    </g>
  <text x="355" y="520" fill="#cbd5e1" font-size="11">• BullMQ Queue Listener</text><text x="355" y="540" fill="#cbd5e1" font-size="11">• Concurrency: 5 Jobs</text><text x="355" y="560" fill="#cbd5e1" font-size="11">• MongoDB Writer</text>
    <g filter="url(#dropShadow)">
      <rect x="590" y="450" width="230" height="170" rx="10" fill="#111827" stroke="#8b5cf6" stroke-width="1.5" />
      <rect x="590" y="450" width="230" height="34" rx="10" fill="#1e293b" />
      <rect x="590" y="480" width="230" height="4" fill="#8b5cf6" />
      <text x="605" y="472" fill="#f8fafc" font-size="14" font-weight="600">AI & Schedulers</text>
      <text x="605" y="500" fill="#94a3b8" font-size="12">Background Tasks</text>
    </g>
  <text x="605" y="520" fill="#cbd5e1" font-size="11">• Debounced AI Anomaly</text><text x="605" y="540" fill="#cbd5e1" font-size="11">• Health Check Cron</text><text x="605" y="560" fill="#cbd5e1" font-size="11">• Daily Retention Purge</text><rect x="900" y="100" width="260" height="700" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" /><text x="915" y="125" fill="#fca5a5" font-size="13" font-weight="700">DATA INFRASTRUCTURE</text>
    <g filter="url(#dropShadow)">
      <rect x="920" y="150" width="220" height="220" rx="10" fill="#111827" stroke="#ef4444" stroke-width="1.5" />
      <rect x="920" y="150" width="220" height="34" rx="10" fill="#1e293b" />
      <rect x="920" y="180" width="220" height="4" fill="#ef4444" />
      <text x="935" y="172" fill="#f8fafc" font-size="14" font-weight="600">Redis 7 Container</text>
      <text x="935" y="200" fill="#94a3b8" font-size="12">Port 6379 (docker-compose)</text>
    </g>
  <text x="935" y="225" fill="#cbd5e1" font-size="12">• Queue Streams & ZSETs</text><text x="935" y="250" fill="#cbd5e1" font-size="12">• AOF Persistence</text><text x="935" y="275" fill="#cbd5e1" font-size="12">• Pub/Sub Broadcast Adapter</text><text x="935" y="300" fill="#cbd5e1" font-size="12">• Memory Limit: 512MB</text>
    <g filter="url(#dropShadow)">
      <rect x="920" y="410" width="220" height="250" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5" />
      <rect x="920" y="410" width="220" height="34" rx="10" fill="#1e293b" />
      <rect x="920" y="440" width="220" height="4" fill="#10b981" />
      <text x="935" y="432" fill="#f8fafc" font-size="14" font-weight="600">MongoDB Atlas / Local</text>
      <text x="935" y="460" fill="#94a3b8" font-size="12">Port 27017 (Mongo 6+)</text>
    </g>
  <text x="935" y="485" fill="#cbd5e1" font-size="12">• Log Collection (Indexed)</text><text x="935" y="510" fill="#cbd5e1" font-size="12">• Workspaces & Projects</text><text x="935" y="535" fill="#cbd5e1" font-size="12">• User Credentials & Keys</text><text x="935" y="560" fill="#cbd5e1" font-size="12">• Compound Indexing</text><text x="935" y="585" fill="#cbd5e1" font-size="12">• Automated TTL Purge</text>
    <g>
      <path d="M 240 210 C 290 210, 290 240, 340 240" fill="none" stroke="#38bdf8" stroke-width="2"  marker-end="url(#arrow)" />
      
        <rect x="229.5" y="214" width="121" height="20" rx="4" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
        <text x="290" y="228" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">HTTP POST :5000</text>
      
    </g>
  
    <g>
      <path d="M 240 390 C 415 390, 415 240, 590 240" fill="none" stroke="#06b6d4" stroke-width="2"  marker-end="url(#arrow)" />
      
        <rect x="351" y="304" width="128" height="20" rx="4" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
        <text x="415" y="318" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">WebSockets :5000</text>
      
    </g>
  
    <g>
      <path d="M 570 270 C 745 270, 745 240, 920 240" fill="none" stroke="#f59e0b" stroke-width="2"  marker-end="url(#arrow-amber)" />
      
        <rect x="698.5" y="244" width="93" height="20" rx="4" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
        <text x="745" y="258" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">Enqueue Job</text>
      
    </g>
  
    <g>
      <path d="M 920 270 C 745 270, 745 500, 570 500" fill="none" stroke="#10b981" stroke-width="2"  marker-end="url(#arrow-amber)" />
      
        <rect x="698.5" y="374" width="93" height="20" rx="4" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
        <text x="745" y="388" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">Dequeue Job</text>
      
    </g>
  
    <g>
      <path d="M 570 540 C 745 540, 745 500, 920 500" fill="none" stroke="#10b981" stroke-width="2"  marker-end="url(#arrow-emerald)" />
      
        <rect x="691.5" y="509" width="107" height="20" rx="4" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
        <text x="745" y="523" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">Write Log Doc</text>
      
    </g>
  
    <g>
      <path d="M 570 510 C 637.5 510, 637.5 360, 705 360" fill="none" stroke="#06b6d4" stroke-width="2"  marker-end="url(#arrow)" />
      
        <rect x="570" y="424" width="135" height="20" rx="4" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
        <text x="637.5" y="438" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">Emit Socket Event</text>
      
    </g>
  </svg>