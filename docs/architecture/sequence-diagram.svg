    <rect x="420" y="415" width="600" height="280" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#10b981" stroke-width="1" stroke-dasharray="6,6" /><text x="435" y="430" fill="#6ee7b7" font-size="12" font-weight="700">Async Background Processing (Phase P Pipeline)</text>
